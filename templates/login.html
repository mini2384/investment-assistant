<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비공개 접속</title>
  <link rel="icon" type="image/png" href="/static/images/app-icon.png" />
  <link rel="apple-touch-icon" href="/static/images/app-icon.png" />
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#d89b32" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .pin-card {
      width: 100%;
      max-width: 380px;
      text-align: center;
      padding: 32px 26px;
    }
    .pin-card h2 {
      font-size: 1.35rem;
      margin-bottom: 8px;
      color: #2d2116;
    }
    .pin-desc {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 20px;
    }
    .pin-input {
      width: 100%;
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 0.55em;
      padding: 12px 14px;
      border: 1.5px solid #e6d1a7;
      border-radius: 12px;
      margin-bottom: 14px;
      outline: none;
    }
    .pin-input:focus {
      border-color: #1392a4;
      box-shadow: 0 0 0 3px rgba(19, 146, 164, 0.18);
    }
    .pin-submit {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #169db0 0%, #0f8292 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .pin-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .pin-error {
      margin-top: 14px;
      font-size: 0.88rem;
      color: #b91c1c;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card pin-card">
    <h2>🔒 비공개 접속</h2>
    <p class="pin-desc">4자리 비밀번호를 입력해 주세요.</p>
    <form id="pinForm">
      <input
        type="password"
        id="pinInput"
        class="pin-input"
        inputmode="numeric"
        pattern="[0-9]{4}"
        maxlength="4"
        autocomplete="off"
        placeholder="••••"
        required
        autofocus
      />
      <button type="submit" id="pinSubmitBtn" class="pin-submit">입장하기</button>
    </form>
    <div id="pinError" class="pin-error"></div>
  </div>

  <script>
    const form = document.getElementById("pinForm");
    const input = document.getElementById("pinInput");
    const btn = document.getElementById("pinSubmitBtn");
    const errBox = document.getElementById("pinError");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.style.display = "none";
      btn.disabled = true;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: input.value.trim() })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = "/";
          return;
        }
        errBox.textContent = data.error || "접속할 수 없습니다.";
        errBox.style.display = "block";
        input.value = "";
        input.focus();
      } catch (err) {
        errBox.textContent = "서버 연결에 실패했습니다.";
        errBox.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
